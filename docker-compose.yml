name: personal-investment-platform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      STORAGE_DIR: ${STORAGE_DIR}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      # ETF iNAV collector (profile service, may be stopped) proxied by /api/v1/inav/snapshot.
      COLLECTOR_URL: ${COLLECTOR_URL:-http://collector:8100}
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/system/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: apps/worker
    environment:
      DATABASE_URL: ${DATABASE_URL}
      STORAGE_DIR: ${STORAGE_DIR}
      WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS}
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: apps/web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    environment:
      N8N_HOST: ${N8N_HOST}
      N8N_PORT: ${N8N_PORT}
      N8N_PROTOCOL: ${N8N_PROTOCOL}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: Asia/Seoul
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows/n8n:/workflows:ro
      - ./storage:/files
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  # ETF iNAV 수집/계산 서비스 (Phase-0 스캐폴드 — profile로 분리, 기본 up에 미포함)
  # 실행: docker compose --profile collector up -d collector
  # 프로브: docker compose --profile collector run --rm collector python -m collector.probe --krx
  collector:
    build:
      context: apps/collector
    profiles: ["collector"]
    environment:
      TZ: Asia/Seoul
      # ── 자립(self-sufficiency) 플래그 ──
      # 구시스템(streaming.py)이 종료돼 이 collector 가 KIS 앱키를 단독 사용한다.
      # 아래 두 플래그를 0/0 으로 되돌리면 구시스템 병행운영 안전모드(piggyback-only,
      # KRX 무접속)로 완전히 복귀한다 — 구시스템 재기동 비교세션용.
      #
      # COLLECTOR_ALLOW_TOKEN_ISSUE=1: 레거시 토큰이 없거나 만료면 KisAuth 가 직접
      #   토큰을 발급(→ /app/.cache 캐시). =0: 발급 금지(piggyback 만, 없으면 REST skip).
      COLLECTOR_ALLOW_TOKEN_ISSUE: "1"
      # COLLECTOR_ALLOW_FETCH=1: 오늘자 레거시 KRX 캐시 CSV 가 없으면 KRX 에서 직접
      #   가져와 /app/.cache/krx/{date}/ 에 동일 포맷으로 저장(basket_source=SELF_FETCH).
      #   =0: 레거시 캐시만 읽음(KRX 무접속, Phase-1 동작).
      # ⚠️ 2026-07-22 임시 "0": KRX per-ticker PDF 셀프수집이 전패(빈 pdf csv 를
      #   SELF_FETCH 로 반환 → 엔진 raise 크래시루프)하고, 구시스템 아침잡도 7/21부터
      #   krx_etf_pdf 를 안 만듦(list/market 만). STALE 캐시(0720)로 기동 — 실시간
      #   바스켓은 CHECK 에이전트 POST 가 소유하므로 시드 지연 무해. 셀프수집 원인
      #   해결 후 "1" 복귀할 것.
      COLLECTOR_ALLOW_FETCH: "0"
      # COLLECTOR_FORCE_FETCH=1: 레거시 캐시가 있어도 항상 self-fetch(테스트/드릴용).
      #   ALLOW_FETCH=1 일 때만 유효. 평시엔 "0"(레거시 캐시 우선).
      COLLECTOR_FORCE_FETCH: "0"
      # KIS/KRX 자격증명 — 중앙 vault(S:\GE\raw\data\_비밀값(중요))에서 .env로 이관됨.
      # collector 서비스에만 스코프 (다른 서비스 env에 넣지 말 것).
      ETF_INAV_MONITOR__KIS_APP_KEY: ${ETF_INAV_MONITOR__KIS_APP_KEY:-}
      ETF_INAV_MONITOR__KIS_APP_SECRET: ${ETF_INAV_MONITOR__KIS_APP_SECRET:-}
      ETF_INAV_MONITOR__KRX_USER: ${ETF_INAV_MONITOR__KRX_USER:-}
      ETF_INAV_MONITOR__KRX_PW: ${ETF_INAV_MONITOR__KRX_PW:-}
    volumes:
      # 쓰기 가능한 캐시(토큰/master/db 스테이징) — 유일한 쓰기 대상.
      - kis_token_cache:/app/.cache
      # 레거시(구시스템) 산출물 — 전부 read-only. 절대 쓰지 않는다.
      # config: 타깃 ETF 목록 등.
      - "/mnt/s/GE/raw/모니터링/실시간 모니터링/ETF_iNAV모니터/config:/srv/legacy/config:ro"
      # etf_data: cache/(token_*.json, master/*.parquet) + output/results/etf_inav/{date}/krx_etf_*.csv
      - "/mnt/s/GE/raw/data/ETF_iNAV모니터:/srv/legacy/etf_data:ro"
      # db: OpenFIGI ISIN 매핑 캐시(ETF_INAV_MONITOR.db). 컨테이너는 /app/.cache 로 복사해 씀.
      - "/mnt/s/GE/raw/data/_데이터베이스:/srv/legacy/db:ro"
      # WRAP: TORUS_코어테크_모니터 config / data(PDF·classification.json) / 운용역 소스 xlsx — 전부 :ro.
      - "/mnt/s/GE/raw/모니터링/실시간 모니터링/TORUS_코어테크_모니터:/srv/legacy/wrap_config:ro"
      - "/mnt/s/GE/raw/data/TORUS_코어테크_모니터:/srv/legacy/wrap_data:ro"
      - "/mnt/s/GE/Wonjae/02_운용펀드_글로벌/(Wrap) 한국투자 미국 AI코어테크랩/4_수익률:/srv/legacy/wrap_source:ro"
      # holidays: 공유 휴장일 캘린더(_공유모듈) — holiday_calendar 싱글턴이 컨테이너 경로로 재배선됨.
      - "/mnt/s/GE/raw/data/_공유모듈/Holidays:/srv/legacy/holidays:ro"
    # 24시간 상시가동: 재부팅·크래시 후 자동 복구 (2026-07-21).
    # 단 profiles:["collector"] 게이트라 최초 1회는 --profile collector 로 띄워야 하며,
    # 그 뒤부터 Docker 재시작 시 자동 기동된다.
    restart: unless-stopped

volumes:
  postgres_data:
  n8n_data:
  kis_token_cache:
