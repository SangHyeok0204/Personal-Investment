name: personal-investment-platform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      STORAGE_DIR: ${STORAGE_DIR}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      # ETF iNAV collector (profile service, may be stopped) proxied by /api/v1/inav/snapshot.
      COLLECTOR_URL: ${COLLECTOR_URL:-http://collector:8100}
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/system/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: apps/worker
    environment:
      DATABASE_URL: ${DATABASE_URL}
      STORAGE_DIR: ${STORAGE_DIR}
      WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS}
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: apps/web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    environment:
      N8N_HOST: ${N8N_HOST}
      N8N_PORT: ${N8N_PORT}
      N8N_PROTOCOL: ${N8N_PROTOCOL}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: Asia/Seoul
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # 파일 노드 허용 경로. ★ 이 버전의 기본값이 빈 값이 아니라 "~/.n8n-files" 라
      #   그 밖의 경로는 전부 `The file "..." is not writable.` 로 막힌다(2026-08-12 실측).
      #   9p 마운트 탓도, 파일 부재 탓도 아니었다 — SecurityConfig.restrictFileAccessTo 다.
      N8N_RESTRICT_FILE_ACCESS_TO: /files
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows/n8n:/workflows:ro
      - ./storage:/files
      # 파일 드롭 다리(2026-08-11) — n8n 이 ./storage/trigger 에 {job}.request.json 을
      # 떨어뜨리면 윈도우의 trigger_watch 가 실행하고 {job}.result.json 으로 답한다.
      # SSH 를 놓으려다 그 PC 샌드박스 ACL(StrictModes)에 막혀 파일 드롭으로 선회했다.
      # ★ 트리거 폴더가 S: 가 아니라 여기인 이유. 처음엔 S:\...\_trigger 였는데 n8n 이
      #   "... is not writable" 로 거부했다. S: 마운트(9p/drvfs) 탓이라 짐작하고 ext4 인
      #   ./storage 로 옮겼지만 **거기서도 같은 오류**가 났다 — 짐작은 틀렸다.
      #   진짜 원인은 위 N8N_RESTRICT_FILE_ACCESS_TO 하나뿐이었다(2026-08-12 확정).
      #   그럼에도 이 자리를 유지하는 건 ./storage 가 이미 /files 로 물려 있어 허용 경로와
      #   그대로 맞아떨어지기 때문이다. 윈도우는 \\wsl.localhost 경로로 읽고 쓴다.
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  # ETF iNAV 수집/계산 서비스 (Phase-0 스캐폴드 — profile로 분리, 기본 up에 미포함)
  # 실행: docker compose --profile collector up -d collector
  # 프로브: docker compose --profile collector run --rm collector python -m collector.probe --krx
  collector:
    build:
      context: apps/collector
    profiles: ["collector"]
    environment:
      TZ: Asia/Seoul
      # LP 평가 일별 산출물 출력 폴더(컨테이너 경로). 아래 :rw 마운트 대상.
      COLLECTOR_LP_EVAL_DIR: /srv/lp_eval
      # [성과보고 · 환] snapshot_report.fx_daily 가 읽을 환율 parquet. S: 의 엔진은
      # 기본값으로 raw\data\_공유모듈\... 을 잡는데 컨테이너엔 그 경로가 없어 갈아끼운다.
      FX_PARQUET_PATH: /srv/legacy/quotes/exchange_rate.parquet
      # ── 자립(self-sufficiency) 플래그 ──
      # 구시스템(streaming.py)이 종료돼 이 collector 가 KIS 앱키를 단독 사용한다.
      # 아래 두 플래그를 0/0 으로 되돌리면 구시스템 병행운영 안전모드(piggyback-only,
      # KRX 무접속)로 완전히 복귀한다 — 구시스템 재기동 비교세션용.
      #
      # COLLECTOR_ALLOW_TOKEN_ISSUE=1: 레거시 토큰이 없거나 만료면 KisAuth 가 직접
      #   토큰을 발급(→ /app/.cache 캐시). =0: 발급 금지(piggyback 만, 없으면 REST skip).
      COLLECTOR_ALLOW_TOKEN_ISSUE: "1"
      # COLLECTOR_ALLOW_FETCH=1: 오늘자 레거시 KRX 캐시 CSV 가 없으면 KRX 에서 직접
      #   가져와 /app/.cache/krx/{date}/ 에 동일 포맷으로 저장(basket_source=SELF_FETCH).
      #   =0: 레거시 캐시만 읽음(KRX 무접속, Phase-1 동작).
      # ⚠️ 2026-07-22 임시 "0": KRX per-ticker PDF 셀프수집이 전패(빈 pdf csv 를
      #   SELF_FETCH 로 반환 → 엔진 raise 크래시루프)하고, 구시스템 아침잡도 7/21부터
      #   krx_etf_pdf 를 안 만듦(list/market 만). STALE 캐시(0720)로 기동. 셀프수집
      #   원인 해결 후 "1" 복귀할 것.
      # ※ 2026-08-03 정정: 위 주석의 "바스켓은 CHECK 에이전트 POST 가 소유하므로
      #   시드 지연 무해"는 사실이 아니었다 — POST(/ingest/hoga)는 호가·체결가만
      #   나르고 바스켓은 안 나른다. 그래서 streaming.py 가 7/31 정지한 뒤 매일
      #   STALE 바스켓으로 돌고 있었다(8/3 발견: 457480 TSLA 수량 425 vs 당일 427).
      #   legacy_inputs 의 CHECK_PDF lane 이 그 자리를 메운다 — 이 플래그와 무관.
      COLLECTOR_ALLOW_FETCH: "0"
      # COLLECTOR_FORCE_FETCH=1: 레거시 캐시가 있어도 항상 self-fetch(테스트/드릴용).
      #   ALLOW_FETCH=1 일 때만 유효. 평시엔 "0"(레거시 캐시 우선).
      COLLECTOR_FORCE_FETCH: "0"
      # KIS/KRX 자격증명 — 중앙 vault(S:\GE\raw\data\_비밀값(중요))에서 .env로 이관됨.
      # collector 서비스에만 스코프 (다른 서비스 env에 넣지 말 것).
      ETF_INAV_MONITOR__KIS_APP_KEY: ${ETF_INAV_MONITOR__KIS_APP_KEY:-}
      ETF_INAV_MONITOR__KIS_APP_SECRET: ${ETF_INAV_MONITOR__KIS_APP_SECRET:-}
      ETF_INAV_MONITOR__KRX_USER: ${ETF_INAV_MONITOR__KRX_USER:-}
      ETF_INAV_MONITOR__KRX_PW: ${ETF_INAV_MONITOR__KRX_PW:-}
    volumes:
      # 쓰기 가능한 캐시(토큰/master/db 스테이징) — 유일한 쓰기 대상.
      - kis_token_cache:/app/.cache
      # 레거시(구시스템) 산출물 — 전부 read-only. 절대 쓰지 않는다.
      # config: 타깃 ETF 목록 등.
      - "/mnt/s/GE/raw/모니터링/실시간 모니터링/ETF_iNAV모니터/config:/srv/legacy/config:ro"
      # etf_data: cache/(token_*.json, master/*.parquet) + output/results/etf_inav/{date}/krx_etf_*.csv
      - "/mnt/s/GE/raw/data/ETF_iNAV모니터:/srv/legacy/etf_data:ro"
      # db: OpenFIGI ISIN 매핑 캐시(ETF_INAV_MONITOR.db). 컨테이너는 /app/.cache 로 복사해 씀.
      - "/mnt/s/GE/raw/data/_데이터베이스:/srv/legacy/db:ro"
      # WRAP: TORUS_코어테크_모니터 config / data(PDF·classification.json) / 운용역 소스 xlsx — 전부 :ro.
      - "/mnt/s/GE/raw/모니터링/실시간 모니터링/TORUS_코어테크_모니터:/srv/legacy/wrap_config:ro"
      - "/mnt/s/GE/raw/data/TORUS_코어테크_모니터:/srv/legacy/wrap_data:ro"
      - "/mnt/s/GE/Wonjae/02_운용펀드_글로벌/(Wrap) 한국투자 미국 AI코어테크랩/4_수익률:/srv/legacy/wrap_source:ro"
      # holidays: 공유 휴장일 캘린더(_공유모듈) — holiday_calendar 싱글턴이 컨테이너 경로로 재배선됨.
      - "/mnt/s/GE/raw/data/_공유모듈/Holidays:/srv/legacy/holidays:ro"
      # GURU[13F]: 13F 거장 공시 DB(filings.db, WAL). 컨테이너는 sidecar-게이트로 /app/.cache 로 복사해 읽음.
      - "/mnt/s/GE/raw/data/13F기관내부자/db:/srv/legacy/guru13f_db:ro"
      # [회의] 회의자료 루트 (PoC). 파일 탐색기로 폴더 탐색 + 자체완결 HTML iframe 렌더.
      - "/mnt/s/GE/_Team/07_회의자료:/srv/legacy/meeting:ro"
      # [뉴스 모니터링 · 텔레그램] 상류 Telegram_Bot(다른 PC 상주)이 굽는 집계 JSON.
      # collector 가 실제로 읽는 파일은 output/dashboard_analysis.json **하나뿐**이다
      # (120초마다 재판독). 같은 폴더의 input/raw·input/processed 와 output 의 일간
      # HTML 은 안 본다.
      # 상류 파이프라인: 30분마다 수집 → input/raw/{방}.csv, 07:30·12:30 토픽 생성
      # → input/processed/, 2시간 슬롯마다 최근 24h 토픽을 Opus 1콜로 집계 → 그 JSON.
      # ★계산이 왜 저쪽에 있나: 이 컨테이너에는 claude 가 없고 인증도 구독 OAuth 라
      # 옮길 수 없다. 성과보고(perf_brief)·매크로와 같은 "S: 가 굽고 대시보드는 읽는다".
      # ⚠️2026-08-12 이전엔 collector 가 raw CSV 를 증분 tail 로 읽어 문장 유사도로
      # 직접 카드를 만들었다(그 방식은 폐기 — 서식이 같으면 남남을 묶었다).
      - "/mnt/s/GE/raw/data/텔레그램모니터:/srv/legacy/telegram:ro"
      # [매크로] 매크로모니터가 구운 output/macro_panels.json (FRED·BLS·CME 계산 결과).
      # 같은 폴더의 db/macro.db 는 CPI/PPI 세부품목까지 담아 300MB 라 읽지 않는다 —
      # 수치는 S: 쪽이 소유하고 collector 는 결과 JSON 만 본다(성과보고 JSON 과 같은 배선).
      - "/mnt/s/GE/raw/data/매크로모니터:/srv/legacy/macro:ro"
      # api 가 이미 쓰는 ./storage 공유(윈도우에서도 \\wsl.localhost 로 편집 가능).
      # ⚠️구 telegram/keywords.json(속보·중요 배지 판정어)은 그 기능이 폐기되면서
      # 읽는 코드가 없다 — 방 고정 머리글이 배지를 도배해 오탐이 났다(2026-08-12).
      # 파일은 남아 있으나 참조 0건이니 이 마운트의 근거로 오해하지 말 것.
      - ./storage:/srv/storage:rw
      # [성과보고] 정기미팅 폴더 — performance-brief 스킬이 만든 daily_*.json /
      # weekly_*.json 을 읽어 TORUS/AI테크 페이지에 네이티브 렌더. 소스 xlsx·HTML 도
      # 같은 폴더에 있지만 collector 는 JSON 만 본다.
      - "/mnt/s/GE/Wonjae/07_회의자료/정기미팅:/srv/legacy/perf_brief:ro"
      # [성과보고] 성과 분석 자동화 프로젝트 — S: 의 bat 이 만든 자체완결 HTML 을 읽어
      # TORUS/AI테크 페이지에 iframe(srcDoc) 렌더. 계산·서사 전부 S: 쪽 소관이라
      # collector 는 파일명 규약으로 고르고 원문만 넘긴다. 루트와 output/ 만 스캔.
      - "/mnt/s/GE/raw/오퍼레이션/성과분석/운용 펀드 성과 분석 자동화:/srv/legacy/perf_analysis:ro"
      # [성과보고 생성] 위 :ro 의 하위 두 폴더만 :rw 로 겹쳐 건다(2026-08-11).
      # perf_generate 가 아침 스케줄로 보고서를 만들면서 쓰는 곳이고, 그 둘뿐이다.
      # 입력(input/)과 엔진(분석엔진/)은 :ro 로 남는다 — 소스와 로직은 운용역 소관이라
      # 컨테이너가 건드릴 자리가 아니다. lp_eval 과 같은 중첩 마운트 패턴이다.
      #   output/  보고서 HTML.  파일명이 대시보드와의 계약(perf_report._classify)
      #   funds/   누적수익률 시계열 JSON. build_funds 가 .tmp 로 쓰고 replace 한다
      - "/mnt/s/GE/raw/오퍼레이션/성과분석/운용 펀드 성과 분석 자동화/output:/srv/legacy/perf_analysis/output:rw"
      - "/mnt/s/GE/raw/오퍼레이션/성과분석/운용 펀드 성과 분석 자동화/funds:/srv/legacy/perf_analysis/funds:rw"
      # [성과보고 · 환] 사내 공유 시세 데이터(LSEG). 전기차 스냅샷은 종목수익률이 상장
      # 거래소 통화 기준이라 원화로 올리려면 다통화 환율이 필요한데, 소스 엑셀엔 없다.
      # snapshot_report.fx_daily 가 exchange_rate.parquet 만 읽는다(대 KRW 10페어).
      # 같은 폴더의 prc_vol.parquet 은 285MB 지만 마운트일 뿐 읽지 않는다.
      - "/mnt/s/GE/raw/data/_공유모듈/시세데이터:/srv/legacy/quotes:ro"
      # LP 평가 일별 산출물(:rw). collector 가 09:05~15:20 매
      # 표본마다 그날치 JSON(lp_eval_{date}.json)·분단위 CSV 를 갱신하고, 전기간 마스터
      # CSV(lp_eval_history.csv)는 매일 16:30 KST 에 1회 이관한다(2026-08-10).
      # 휴장일·주말에는 표본 자체가 없어 파일도 안 생긴다.
      # etf_data(:ro)의 하위 폴더지만 별개 마운트라 쓰기 가능.
      - "/mnt/s/GE/raw/data/ETF_iNAV모니터/lp_eval:/srv/lp_eval:rw"
    # 24시간 상시가동: 재부팅·크래시 후 자동 복구 (2026-07-21).
    # 단 profiles:["collector"] 게이트라 최초 1회는 --profile collector 로 띄워야 하며,
    # 그 뒤부터 Docker 재시작 시 자동 기동된다.
    restart: unless-stopped

volumes:
  postgres_data:
  n8n_data:
  kis_token_cache:
