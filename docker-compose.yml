name: personal-investment-platform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      STORAGE_DIR: ${STORAGE_DIR}
      VALUECHAIN_DIR: /app/storage/valuechain
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      KRX_USER: ${KRX_USER:-}
      KRX_PW: ${KRX_PW:-}
      OPENDART_API_KEY: ${OPENDART_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      RESEARCH_DIR: ${RESEARCH_DIR:-}
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/system/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: apps/worker
    environment:
      DATABASE_URL: ${DATABASE_URL}
      STORAGE_DIR: ${STORAGE_DIR}
      WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS}
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: apps/web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    environment:
      N8N_HOST: ${N8N_HOST}
      N8N_PORT: ${N8N_PORT}
      N8N_PROTOCOL: ${N8N_PROTOCOL}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: Asia/Seoul
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # 파일 노드 허용 경로. ★ 이 버전의 기본값이 빈 값이 아니라 "~/.n8n-files" 라
      #   그 밖의 경로는 전부 `The file "..." is not writable.` 로 막힌다(2026-08-12 실측).
      #   9p 마운트 탓도, 파일 부재 탓도 아니었다 — SecurityConfig.restrictFileAccessTo 다.
      N8N_RESTRICT_FILE_ACCESS_TO: /files
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows/n8n:/workflows:ro
      - ./storage:/files
      # 파일 드롭 다리(2026-08-11) — n8n 이 ./storage/trigger 에 {job}.request.json 을
      # 떨어뜨리면 윈도우의 trigger_watch 가 실행하고 {job}.result.json 으로 답한다.
      # SSH 를 놓으려다 그 PC 샌드박스 ACL(StrictModes)에 막혀 파일 드롭으로 선회했다.
      # ★ 트리거 폴더가 S: 가 아니라 여기인 이유. 처음엔 사내 경로의 _trigger 였는데 n8n 이
      #   "... is not writable" 로 거부했다. S: 마운트(9p/drvfs) 탓이라 짐작하고 ext4 인
      #   ./storage 로 옮겼지만 **거기서도 같은 오류**가 났다 — 짐작은 틀렸다.
      #   진짜 원인은 위 N8N_RESTRICT_FILE_ACCESS_TO 하나뿐이었다(2026-08-12 확정).
      #   그럼에도 이 자리를 유지하는 건 ./storage 가 이미 /files 로 물려 있어 허용 경로와
      #   그대로 맞아떨어지기 때문이다. 윈도우는 \\wsl.localhost 경로로 읽고 쓴다.
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  n8n_data:
